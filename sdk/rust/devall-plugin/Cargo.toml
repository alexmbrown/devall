[package]
name = "devall-plugin"
description = "Write /dev/all WebAssembly plugins in Rust: the JSON contracts, host calls and the ABI glue"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

# Not part of the /dev/all workspace: plugins build for wasm32-unknown-unknown on their own.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
