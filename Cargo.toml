[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[workspace.dependencies]
devall-core = { path = "crates/devall-core" }
devall-http = { path = "crates/devall-http" }
devall-utils = { path = "crates/devall-utils" }
devall-script = { path = "crates/devall-script" }
devall-openapi = { path = "crates/devall-openapi" }

anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
dotenvy = "0.15"
fastrand = "2"
hex = "0.4"
hmac = "0.13"
html-escape = "0.3"
indexmap = { version = "2", features = ["serde"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
keyring = "4.2"
md-5 = "0.11"
percent-encoding = "2.3"
schemars = { version = "1.2", features = ["indexmap2", "preserve_order"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "cookies", "gzip", "brotli", "deflate", "zstd", "multipart", "stream", "system-proxy", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
trash = "5"
ulid = "3"
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }

# DuckDB (devall-logs) is huge in debug builds; optimize it and drop its debug info.
[profile.dev.package.libduckdb-sys]
debug = false
opt-level = 2

# wasmi (plugins) interprets many times slower unoptimised: plugin calls in debug builds would hit
# their time limits.
[profile.dev.package.wasmi]
opt-level = 2

[profile.dev.package.wasmi_core]
opt-level = 2

[profile.dev.package.wasmi_ir]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
strip = true
