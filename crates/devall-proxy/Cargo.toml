[package]
name = "devall-proxy"
description = "Traffic inspector for /dev/all: local MITM HTTP(S) debugging proxy with a per-user CA, rules, breakpoints and capture exports (HAR, WireMock, OpenAPI, requests, load tests)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
devall-core.workspace = true
devall-http.workspace = true
# Live OpenAPI validation rule (compiled once per rule).
devall-openapi.workspace = true
base64.workspace = true
brotli = "9.0"
bytes = "1.12"
chrono.workspace = true
fastrand.workspace = true
flate2 = "1.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1.4"
http-body-util = "0.1.5"
hyper = { version = "1.8", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "client", "client-legacy", "http1", "http2"] }
percent-encoding.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
regex = "1.13"
rustls = "0.23"
rustls-platform-verifier = "0.7"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = "0.3"
tokio = { workspace = true, features = ["sync", "time", "net", "io-util", "rt-multi-thread", "macros", "fs"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tower-service = "0.3"
trash.workspace = true
url.workspace = true
zstd = "0.14"

[dev-dependencies]
devall-load = { path = "../devall-load" }
devall-mock = { path = "../devall-mock" }
reqwest.workspace = true
tempfile.workspace = true
tokio-tungstenite = { version = "0.30", features = ["connect"] }
