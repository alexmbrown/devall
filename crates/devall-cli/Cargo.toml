devall-mcp = { path = "../devall-mcp" }
devall-mock = { path = "../devall-mock" }
devall-openapi.workspace = true
devall-plugins = { path = "../devall-plugins" }
devall-relay = { path = "../devall-relay" }
devall-webhooks = { path = "../devall-webhooks" }
devall-utils.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tokio = { workspace = true, features = ["signal"] }
