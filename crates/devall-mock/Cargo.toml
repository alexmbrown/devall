[package]
name = "devall-mock"
description = "WireMock-compatible mock HTTP server engine for /dev/all"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
devall-core = { path = "../devall-core" }
# gRPC mocks: .proto compilation (protox), dynamic messages and the tonic codec.
devall-proto = { path = "../devall-proto" }
base64.workspace = true
bytes = "1.12"
chrono.workspace = true
chrono-tz = "0.10"
fake = { version = "5.1", features = ["random_color"] }
fancy-regex = "0.19"
fastrand.workspace = true
handlebars = "6.4"
http = "1.5"
http-body-util = "0.1.5"
indexmap.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hyper = { version = "1.12", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
percent-encoding.workspace = true
prost = "0.14"
prost-reflect = "0.16"
prost-types = "0.14"
regex = "1.13"
reqwest.workspace = true
# MQTT broker: rumqttc's packet codec (no client is used here).
rumqttc = { version = "0.25", default-features = false }
# Read-only lookups for SQLite data sources (mocks/data/*.db); same version as the other crates.
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
serde_json_path = "0.7"
sxd-document = "0.3"
sxd-xpath = "0.4"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# gRPC: tonic's body type and the reflection service; the mock frames messages itself.
tonic = { version = "0.14", default-features = false }
tonic-reflection = { version = "0.14", default-features = false, features = ["server"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
trash.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
# WebSocket client for the protocol tests (same version, client side of the handshake).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
