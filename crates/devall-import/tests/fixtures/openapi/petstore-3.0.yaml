openapi: 3.0.3
info:
  title: Swagger Petstore
  description: A sample Pet Store server.
  version: 1.0.17
servers:
  - url: https://{environment}.petstore.test/api/v3
    description: Production
    variables:
      environment:
        default: api
        enum: [api, api.dev]
  - url: http://localhost:8080/api/v3/
    description: Local
tags:
  - name: pet
    description: Everything about your Pets
  - name: store
    description: Access to Petstore orders
  - name: user
    description: Operations about user
security:
  - api_key: []
paths:
  /pet:
    put:
      tags: [pet]
      summary: Update an existing pet
      operationId: updatePet
      requestBody:
        $ref: '#/components/requestBodies/Pet'
      responses:
        '200':
          description: Successful operation
      security:
        - petstore_auth: [write:pets, read:pets]
    post:
      tags: [pet]
      summary: Add a new pet to the store
      operationId: addPet
      requestBody:
        $ref: '#/components/requestBodies/Pet'
      responses:
        '200':
          description: Successful operation
  /pet/findByStatus:
    get:
      tags: [pet]
      summary: Finds Pets by status
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [available, pending, sold]
            default: available
        - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: successful operation
  /pet/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          example: 10
    get:
      tags: [pet]
      summary: Find pet by ID
      operationId: getPetById
      deprecated: true
      description: Returns a single pet
      parameters:
        - name: X-Request-ID
          in: header
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: successful operation
    post:
      tags: [pet]
      summary: Updates a pet in the store with form data
      operationId: updatePetWithForm
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: doggie
                status:
                  type: string
                  enum: [available, sold]
      responses:
        '200':
          description: successful operation
    delete:
      tags: [pet]
      summary: Deletes a pet
      operationId: deletePet
      security: []
      responses:
        '400':
          description: Invalid pet value
  /pet/{petId}/uploadImage:
    post:
      tags: [pet]
      summary: uploads an image
      operationId: uploadFile
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
        - name: additionalMetadata
          in: query
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                caption:
                  type: string
            encoding:
              file:
                contentType: image/png
      responses:
        '200':
          description: successful operation
  /store/order:
    post:
      tags: [store]
      summary: Place an order for a pet
      operationId: placeOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
            examples:
              sample:
                $ref: '#/components/examples/OrderExample'
      responses:
        '200':
          description: successful operation
  /user/login:
    get:
      tags: [user]
      summary: Logs user into the system
      parameters:
        - name: username
          in: query
          schema:
            type: string
        - name: password
          in: query
          schema:
            type: string
            format: password
      security:
        - basicAuth: []
      responses:
        '200':
          description: successful operation
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: OK
components:
  parameters:
    limitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  requestBodies:
    Pet:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Pet'
        application/xml:
          schema:
            $ref: '#/components/schemas/Pet'
  examples:
    OrderExample:
      summary: A small order
      value:
        id: 7
        petId: 10
        quantity: 2
        status: placed
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Dogs
        parent:
          $ref: '#/components/schemas/Category'
    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    Pet:
      type: object
      required: [name, photoUrls]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          example: doggie
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          items:
            type: string
            format: uri
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          enum: [available, pending, sold]
    Order:
      allOf:
        - type: object
          properties:
            id:
              type: integer
        - type: object
          properties:
            shipDate:
              type: string
              format: date-time
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://petstore.test/oauth/authorize
          scopes:
            write:pets: modify pets in your account
            read:pets: read your pets
        clientCredentials:
          tokenUrl: https://petstore.test/oauth/token
          scopes:
            write:pets: modify pets in your account
            read:pets: read your pets
    api_key:
      type: apiKey
      name: api_key
      in: header
    basicAuth:
      type: http
      scheme: basic
