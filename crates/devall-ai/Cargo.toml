[package]
name = "devall-ai"
description = "Local-first AI layer for /dev/all: providers, discovery, managed llama.cpp sidecar, model catalog, project-aware features"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
devall-core.workspace = true
# jq (jaq) to validate NL → jq suggestions against the sample.
devall-utils.workspace = true
fastrand.workspace = true
hex.workspace = true
regex = "1.13"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_path = "0.7"
# OpenAPI drafts arrive as YAML ("Improve names with AI").
serde_yaml_ng.workspace = true
sha2.workspace = true
thiserror.workspace = true
trash.workspace = true
tokio = { workspace = true, features = ["process", "sync", "fs"] }
url.workspace = true
# Extracting llama.cpp release archives (.zip on Windows, .tar.gz on macOS/Linux).
flate2 = "1.1"
tar = "0.4"
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile.workspace = true
