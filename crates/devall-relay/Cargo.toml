[package]
name = "devall-relay"
description = "Client for the /dev/all relay: reverse tunnels to localhost and the hosted webhook inbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
bytes = "1.11"
devall-core.workspace = true
fastrand.workspace = true
hex.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
http = "1.5"
http-body-util = "0.1"
hyper = { version = "1.8", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging", "aws_lc_rs"] }
rustls-platform-verifier = "0.7"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "aws_lc_rs"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
